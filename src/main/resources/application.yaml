spring:
  application:
    name: ai-matching-service
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true

#openai setting
openai:
  api:
    key: ${OPENAI_API_KEY}
    url: https://api.openai.com/v1/responses
  # 프롬프트를 설정 파일로 관리
  prompt:
    matching: >
      너는 전문 소셜 미디어 마케터야. 아래 사용자의 요청을 분석해서 추천 정보를 JSON으로 답해줘.
      
      [제약 조건]
      1. 배우나 아이돌 같은 대중 연예인은 제외하고, 인스타그램/유튜브에서 활동하는 '실제 인플루언서'만 추천해.
      2. 이름(name) 필드에는 그 사람의 활동명(예: 춈미, 아옳이 등)을 정확히 적어줘.
      3. 설명이나 마크다운 태그 없이 오직 순수한 JSON만 출력해.
      
      형식: {"name": "활동명", "category": "FASHION", "style": "CASUAL"}
      사용자 요청: %s